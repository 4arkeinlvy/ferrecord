[workspace]
resolver = "3"
members = ["crates/core", "crates/vad", "crates/audio", "tools/vad-eval", "tools/vad-live"]
# Vendored code is compiled as a dependency, never formatted or linted as ours.
exclude = ["third_party", "spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.90"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Pure-Rust DSP/VAD code is slow in debug; keep tests and dev runs usable.
[profile.dev.package."*"]
opt-level = 2
