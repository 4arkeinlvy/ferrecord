[package]
name = "spike-tokio"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
spike-common = { path = "../common" }
futures-util = { version = "0.3.34", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
tokio = { version = "1.53.3", features = ["rt", "time", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }

[features]
default = ["tls"]
tls = ["reqwest/native-tls"]
