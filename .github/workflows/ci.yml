name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  REQUIRE_GOLDEN: "1"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (cpal/ALSA for tools/vad-live)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Golden audio for the Silero parity test
        run: scripts/fetch-golden.sh
      # Release: the pure-Rust DSP/VAD code is slow unoptimized, and the golden test runs 5k chunks.
      - run: cargo test --workspace --release
      - name: Longer property sweep
        run: cargo test --release -p recorder-core --test properties
        env:
          PROPTEST_CASES: "5000"
      - name: Guard - no async runtime in the desktop dependency graph (ADR 0001)
        run: |
          if cargo tree --workspace -e normal -i tokio >/dev/null 2>&1; then
            cargo tree --workspace -e normal -i tokio
            echo "::error::tokio entered the desktop dependency graph (see docs/decisions/0001)"
            exit 1
          fi

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/fetch-golden.sh
      - run: cargo test --workspace --release
      - name: Release build of the tools
        run: cargo build --release -p vad-eval -p vad-live
